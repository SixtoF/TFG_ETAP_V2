
services:
  postgres:
    image: postgres:15
    container_name: etap_db_nueva  # <--- NUEVO NOMBRE DE CONTENEDOR
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pruebas2026
      POSTGRES_DB: etap_final_db    # <--- NUEVA BASE DE DATOS
    ports:
      - "5432:5432"
    volumes:
      - postgres_nueva_data:/var/lib/postgresql/data # <-- VOLUMEN NUEVO

  redis:
    image: redis:7
    container_name: etap_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: etap_api
    command: /app/scripts/start-api.sh
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  celery_worker:
    build: .
    container_name: etap_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  celery_beat:
    build: .
    container_name: etap_beat
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  pgadmin:
    image: dpage/pgadmin4
    container_name: etap_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@etap.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_nueva_data: